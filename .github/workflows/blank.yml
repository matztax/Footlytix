name: Build APK und AAB

on:
  push:
  workflow_dispatch:

env:
  HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Neueste Projekt-ZIP entpacken
        run: |
          echo "ZIP-Dateien im Repo:"
          find . -iname '*.zip' -not -path './.git/*'
          BEST=""
          BEST_T=0
          while IFS= read -r z; do
            if unzip -l "$z" | grep -q "de/tactics/app/MainViewModel.kt"; then
              T=$(git log -1 --format=%ct -- "${z#./}")
              echo "Kandidat: $z (Commit-Zeit $T)"
              if [ "${T:-0}" -gt "$BEST_T" ]; then BEST="$z"; BEST_T="$T"; fi
            fi
          done < <(find . -iname '*.zip' -not -path './.git/*')
          if [ -z "$BEST" ]; then
            echo "Keine passende ZIP mit dem Projekt gefunden"
            exit 1
          fi
          echo "Verwende: $BEST"
          unzip -oq "$BEST" -d _project
          echo "PROJECT_DIR=_project" >> "$GITHUB_ENV"
          GV=$(cat _project/.gradle-version 2>/dev/null || echo 8.11.1)
          echo "GRADLE_VERSION=$GV" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android-Lizenzen akzeptieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Debug-APK bauen
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Futlytix-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Release-AAB bauen (nur mit Schluessel)
        if: env.HAS_KEY == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          gradle bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: Futlytix-release-aab
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab

